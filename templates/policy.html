{% extends "base.html" %}{% block title %}Network policy · Wispdeck{% endblock %}{% block content %}
<div class="heading"><div><p class="eyebrow">EGRESS BOUNDARY</p><h1>Network policy</h1></div></div>{% if !message.is_empty() %}<p class="notice">{{ message }}</p>{% endif %}<form method="post" class="panel form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Allowed TCP ports<input name="allowed_ports" value="{{ allowed_ports }}" required><small>Comma-separated. UDP is always disabled.</small></label><label>Allowed hostnames<textarea name="allowed_hosts" rows="5">{{ allowed_hosts }}</textarea><small>Empty allows any hostname; use exact names or <code>*.example.com</code>.</small></label><label>Blocked hostnames<textarea name="blocked_hosts" rows="5">{{ blocked_hosts }}</textarea></label><label class="check"><input type="checkbox" name="allow_direct_ip" {% if allow_direct_ip %}checked{% endif %}> Allow direct IP destinations</label><label class="check"><input type="checkbox" name="allow_non_public_ips" {% if allow_non_public_ips %}checked{% endif %}> Allow private/reserved resolved addresses (unsafe)</label><label>Maximum clients<input type="number" min="1" name="max_clients" value="{{ max_clients }}"></label><label>Streams per client<input type="number" min="1" name="streams_per_client" value="{{ streams_per_client }}"></label><label>Pending dials<input type="number" min="1" name="pending_dials" value="{{ pending_dials }}"></label><button>Validate and save</button></form>
{% endblock %}
