{% extends "base.html" %}{% block title %}Server settings · Wispdeck{% endblock %}{% block content %}
<div class="heading"><div><p class="eyebrow">RUNTIME</p><h1>Server settings</h1></div></div>{% if !message.is_empty() %}<p class="notice">{{ message }}</p>{% endif %}<form method="post" class="panel form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Listen address<input name="listen" value="{{ listen }}"><small>Restart required</small></label><label>Log level<input name="log_level" value="{{ log_level }}"><small>Restart required</small></label><label>DNS timeout (seconds)<input type="number" min="1" name="dns_seconds" value="{{ dns_seconds }}"></label><label>Dial timeout (seconds)<input type="number" min="1" name="dial_seconds" value="{{ dial_seconds }}"></label><label>Stream idle timeout (seconds)<input type="number" min="1" name="idle_seconds" value="{{ idle_seconds }}"></label><button>Validate and save</button></form>
{% endblock %}
