[package]
name = "wispdeck"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Self-hosted Wisp server with an integrated administration interface"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
askama = "0.14"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "ws"] }
base64 = "0.22"
bytes = "1.10"
futures-util = { version = "0.3", features = ["sink"] }
http = "1.3"
ipnet = { version = "2.11", features = ["serde"] }
rand = "0.9"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
wisp-mux = { git = "https://github.com/MercuryWorkshop/epoxy-tls", rev = "9cde724aea1a0f5e46b1c962b3d19ca1389af074", default-features = false, features = ["tokio-websockets"] }

[dev-dependencies]
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
